services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: weagent
      POSTGRES_DB: weagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in private .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weagent -d weagent"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    build: .
    entrypoint: ["/migrate"]
    command: ["up"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL with hostname db}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  gateway:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL with hostname db}
      GATEWAY_HMAC_KEY: ${GATEWAY_HMAC_KEY:?set a persistent random base64 key}
      AUTH_MODE: wechat
      WECHAT_APP_ID: ${WECHAT_APP_ID:?set production AppID}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:?set production AppSecret}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      LISTEN_ADDR: 0.0.0.0:8080
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
volumes:
  postgres-data:
