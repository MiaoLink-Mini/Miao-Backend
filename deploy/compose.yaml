name: weagent
x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}
x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging: *logging
services:
  db:
    image: postgres@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    env_file: /opt/weagent/private/db.env
    volumes: ["postgres-data:/var/lib/postgresql"]
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U weagent_owner -d weagent"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 1g
    pids_limit: 256
    logging: *logging
    restart: unless-stopped
  migrate:
    <<: *hardened
    image: ${GATEWAY_IMAGE:?set immutable image tag}
    env_file: /opt/weagent/private/migrate.env
    entrypoint: [/migrate]
    command: [up]
    networks: [database]
    profiles: [maintenance]
    depends_on:
      db: {condition: service_healthy}
  gateway:
    <<: *hardened
    image: ${GATEWAY_IMAGE:?set immutable image tag}
    env_file: /opt/weagent/private/gateway.env
    networks: [database, ingress]
    depends_on:
      db: {condition: service_healthy}
    mem_limit: 512m
    pids_limit: 128
    restart: unless-stopped
    stop_grace_period: 30s
  caddy:
    <<: *hardened
    cap_add: [NET_BIND_SERVICE]
    image: caddy@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    ports: ["80:80", "443:443"]
    volumes:
      - ${RELEASE_DIR:?set release directory}/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${RELEASE_DIR}/site:/srv:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      ingress: {ipv4_address: 172.30.90.2}
    mem_limit: 256m
    pids_limit: 128
    restart: unless-stopped
volumes:
  postgres-data:
  caddy-data:
  caddy-config:
networks:
  database: {internal: true}
  ingress:
    ipam:
      config: [{subnet: 172.30.90.0/24}]
