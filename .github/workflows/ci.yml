name: Backend CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      frontend_ref:
        description: 'Explicit Miao-Frontend commit, tag or branch'
        type: string
        required: true
        default: '00a2650f4bf3d320ca26282cd759a96c1a56edb0'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go / PostgreSQL 18
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: weagent
          POSTGRES_PASSWORD: golink-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U weagent -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # Ephemeral service only. The suite creates and drops its own test databases.
      TEST_DATABASE_URL: postgres://weagent:golink-ci-only@127.0.0.1:5432/postgres?sslmode=disable
    defaults:
      run:
        shell: bash
        working-directory: WeAgent-Backend
    steps:
      - name: Check out backend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: WeAgent-Backend
          persist-credentials: false

      - name: Set up the toolchain declared by the repository
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: WeAgent-Backend/go.mod
          cache-dependency-path: WeAgent-Backend/go.sum

      - name: Record the source revision and Go toolchain
        run: |
          {
            printf '### Go / PostgreSQL 18\n\n'
            printf -- '- Backend: `%s`\n' "$(git rev-parse HEAD)"
            printf -- '- Toolchain: `%s`\n' "$(go version)"
            printf -- '- Database integration: TEST_DATABASE_URL is explicitly configured.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download and verify Go modules
        run: |
          go mod download
          go mod verify

      - name: Enforce formatting without changing source
        run: |
          mapfile -d '' files < <(git ls-files -z -- '*.go')
          if (( ${#files[@]} == 0 )); then
            echo "::error::No tracked Go source files found."
            exit 1
          fi
          unformatted="$(gofmt -l "${files[@]}")"
          if [[ -n "$unformatted" ]]; then
            printf '%s\n' "$unformatted"
            echo "::error::Run gofmt on the listed files and commit the result."
            exit 1
          fi

      - name: Vet Go packages
        run: go vet ./...

      - name: Run all Go tests with PostgreSQL, race detection and coverage
        run: |
          test -n "$TEST_DATABASE_URL"
          go test -race -count=1 -timeout 5m -covermode=atomic -coverprofile=coverage.out ./...

      - name: Retain coverage, including on test failure
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-go-coverage
          path: WeAgent-Backend/coverage.out
          if-no-files-found: warn
          retention-days: 14

      - name: Build Linux executables
        run: |
          mkdir -p bin
          CGO_ENABLED=0 go build -trimpath -o bin/gateway ./cmd/gateway
          CGO_ENABLED=0 go build -trimpath -o bin/migrate ./cmd/migrate
          go build ./cmd/...

      - name: Retain checked Linux executables without publishing a release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-linux-amd64
          path: |
            WeAgent-Backend/bin/gateway
            WeAgent-Backend/bin/migrate
          if-no-files-found: error
          retention-days: 7

  contracts:
    name: Contracts / Frontend baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: WeAgent-Backend
    steps:
      - name: Check out backend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: WeAgent-Backend
          persist-credentials: false

      - name: Check out the reviewed frontend version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MiaoLink-Mini/Miao-Frontend
          ref: ${{ inputs.frontend_ref || '00a2650f4bf3d320ca26282cd759a96c1a56edb0' }}
          path: WeAgent-Frontend
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: WeAgent-Backend/package-lock.json

      - name: Record the exact source revisions
        run: |
          {
            printf '### Contracts / Frontend baseline\n\n'
            printf -- '- Backend: `%s`\n' "$(git rev-parse HEAD)"
            printf -- '- Frontend: `%s`\n' "$(git -C ../WeAgent-Frontend rev-parse HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install locked verification dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check committed generated types
        run: npm run check:generated

      - name: Verify the recovered historical source bytes
        run: node scripts/check-baseline-sources.cjs

      - name: Run the complete JavaScript suite, including historical assertions
        run: npm test

  docker:
    name: Dockerfile build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: WeAgent-Backend
    steps:
      - name: Check out backend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: WeAgent-Backend
          persist-credentials: false

      - name: Build the existing image without pushing or deploying
        run: docker build --tag golink-backend:ci .
